name: Bug report
description: Report a reproducible problem in Vaelora.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >
        Search existing issues before submitting. Do not include passwords, private keys,
        personal data, or other sensitive information in reports or attachments.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the effect on play.
      placeholder: What did you observe?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Start a match with...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - macOS
        - Linux
        - Web
        - Not applicable or unknown
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build, version, or commit
      description: If available, provide the version or commit being tested.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Attach only project-safe evidence; remove personal or secret data.
    validations:
      required: false
